name: GlassMPV
options:
  bundleIdPrefix: com.glassmpv
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  MPVUI:
    url: https://github.com/LePips/MPVUI.git
    from: "0.11.0"

targets:
  GlassMPV:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
      - path: Resources/Assets.xcassets
      - path: Resources/Shaders
        type: folder
        buildPhase: resources
    dependencies:
      - package: MPVUI
        product: MPVUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glassmpv.player
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
    scheme:
      testTargets:
        - GlassMPVTests

  GlassMPVTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests
        includes:
          - "**/*.swift"
    dependencies:
      - target: GlassMPV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glassmpv.player.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GlassMPV.app/GlassMPV"
        BUNDLE_LOADER: "$(TEST_HOST)"
